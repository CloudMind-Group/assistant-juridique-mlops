apiVersion: 1

providers:
  - name: cloudmind
    orgId: 1
    folder: CloudMind
    type: file
    disableDeletion: true
    # Les tableaux de bord sont versionnés dans le dépôt : toute modification
    # passe par une pull request, jamais par l'interface Grafana.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
