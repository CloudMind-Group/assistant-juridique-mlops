# Collecte Prometheus — M7.
# Intervalle de 15 s, conformément au contrat docs/OBSERVABILITE.md §1.1.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projet: assistant-juridique
    environnement: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Cible provisoire : le simulateur applique le contrat §1.3 à l'identique.
  # Bascule vers M5 : remplacer `mock-exporter:8000` par l'adresse du service
  # d'API. Aucune autre ligne de cette pile n'a à changer.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-exporter:8000"]
        labels:
          module: M5
          service: assistant-api
