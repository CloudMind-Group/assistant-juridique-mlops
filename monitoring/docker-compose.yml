# Pile d'observabilité M7 — exécution locale.
#
# Livrable 1 du module : Prometheus + Grafana + Loki + Alertmanager.
# `mock-exporter` produit des métriques conformes au contrat défini dans
# docs/OBSERVABILITE.md §1, ce qui rend la pile vérifiable avant que l'API de
# M5 existe. Le jour où M5 expose `/metrics`, il suffit de remplacer la cible
# dans prometheus/prometheus.yml : rien d'autre ne bouge.
#
#   docker compose -f monitoring/docker-compose.yml up -d
#   Grafana http://localhost:3000  ·  Prometheus http://localhost:9090
#
# ---------------------------------------------------------------------------
# Ports : des variables, pas des constantes
# ---------------------------------------------------------------------------
#
# Les valeurs par défaut ci-dessous sont celles d'un poste de travail, où l'on
# est seul à écouter. Elles ne tiennent pas sur un serveur partagé.
#
# Constaté en déployant, le 9 septembre 2026, sur le serveur `vh3` de la
# plateforme de la faculté, que dix-neuf groupes se partagent :
#
#     Bind for 0.0.0.0:8000 failed: port is already allocated
#
# Un autre groupe occupait 8000 — et l'ayant lié à `0.0.0.0`, il fermait aussi
# `127.0.0.1:8000`. Les ports 3000, 9090, 9093 et 3100 courent le même risque :
# ce sont les valeurs par défaut de Grafana, Prometheus, Alertmanager et Loki,
# donc celles que tout le monde utilise.
#
# Plutôt que d'inscrire dans ce dépôt les numéros d'une plateforme particulière
# — ce qui le rendrait inutilisable ailleurs — chaque port est une variable :
#
#     PROMETHEUS_PORT · ALERTMANAGER_PORT · LOKI_PORT · MOCK_PORT
#     GRAFANA_PORT    · GRAFANA_BIND      · GF_SERVER_ROOT_URL
#     TEMPO_PORT      · OTLP_GRPC_PORT    · OTLP_HTTP_PORT
#
# Sans `.env`, les valeurs par défaut s'appliquent et rien ne change pour qui
# lance la pile sur sa machine. L'environnement de déploiement fournit les
# siennes — c'est lui qui connaît sa plage de ports, pas le dépôt.
#
# Plage attribuée au groupe cloudmind sur cette plateforme : 36XX.
#
#     3601  Grafana, publié           GRAFANA_BIND=0.0.0.0  GRAFANA_PORT=3601
#     3690  Prometheus, boucle locale PROMETHEUS_PORT=3690
#     3691  Loki, boucle locale       LOKI_PORT=3691
#     3692  Tempo, id.                TEMPO_PORT=3692
#     3693  Alertmanager, id.         ALERTMANAGER_PORT=3693
#     3695  simulateur, id.           MOCK_PORT=3695
#     3696  collecteur OTLP gRPC      OTLP_GRPC_PORT=3696
#     3697  collecteur OTLP HTTP      OTLP_HTTP_PORT=3697
#
# Les deux ports du collecteur méritent une note : 4317 et 4318 sont les
# valeurs par défaut d'OpenTelemetry, donc parmi les plus disputées qui
# soient sur une machine partagée entre projets d'observabilité.
#
# `GRAFANA_BIND` est la seule adresse de liaison variable, et c'est délibéré :
# Grafana exige une authentification, les cinq autres services n'en ont
# aucune. Loki sert le journal d'audit — trois ans de traces d'accès au
# corpus. Les publier reviendrait à l'ouvrir à tout le segment réseau.

name: cloudmind-observabilite

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cm-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Liaison sur la boucle locale uniquement. Sans adresse explicite Docker
      # publie sur 0.0.0.0 : Prometheus et Alertmanager n'ont aucune
      # authentification native, et Loki expose le journal d'audit. Sur un
      # réseau partagé, tout le segment pourrait les interroger.
      #
      # Le numéro de port est une variable, pas une constante — voir l'en-tête
      # de ce fichier, section « Ports ». La valeur par défaut est celle du
      # poste de travail ; un serveur partagé fournit la sienne.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: cm-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Les URL de webhook ne sont jamais versionnées : elles sont montées
      # depuis un fichier local ignoré par Git (voir monitoring/README.md).
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: cm-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: cm-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Journal d'audit produit par l'application (contrat §2).
      - ./audit:/var/log/cloudmind:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cm-grafana
    environment:
      # Identifiants de développement local uniquement. En déploiement réel,
      # ces valeurs proviennent du gestionnaire de secrets de M4.
      # Aucune valeur par défaut : la pile refuse de monter tant que les
      # variables ne sont pas fournies. Un défaut d'authentification qui passe
      # inaperçu est plus dangereux qu'une configuration absente qui bloque le
      # démarrage — l'accès administrateur Grafana ouvre les sources de
      # données, donc Loki, donc le journal d'audit.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER requis — voir monitoring/README.md}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD requis — voir monitoring/README.md}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Un visiteur non authentifié ne voit rien, pas même en lecture seule :
      # les tableaux de bord exposent les routes de l'API, les volumétries et
      # les identifiants de documents cités.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nécessaire dès que le service n'est plus servi depuis `localhost` :
      # sans cela, les liens produits par Grafana — partage de tableau de
      # bord, retour d'authentification — pointent vers une adresse que le
      # visiteur ne peut pas atteindre.
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
    volumes:
      # Les deux sous-répertoires sont montés séparément : monter
      # `provisioning/` en entier masquerait `plugins/` et `alerting/`, que
      # Grafana s'attend à trouver et dont l'absence produit une erreur à
      # chaque démarrage.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Seul service dont l'adresse de liaison est elle-même variable. C'est
      # lui, et lui seul, qui a vocation à être joignable depuis l'extérieur
      # d'un serveur : il porte une authentification, les cinq autres non.
      # Par défaut il reste sur la boucle locale, comme eux.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    container_name: cm-tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      # Seule l'API de lecture est publiée, et sur la boucle locale : c'est
      # Grafana qui interroge Tempo, et le collecteur qui l'alimente — tous
      # deux depuis le réseau Docker. Publier les ports OTLP exposerait un
      # point d'écriture sans authentification.
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: cm-otel-collector
    command: --config=/etc/otel/otel-collector-config.yml
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel/otel-collector-config.yml:ro
    ports:
      # Publiés parce qu'un service lancé hors Docker — l'API de M5 en
      # développement, par exemple — doit pouvoir émettre vers le collecteur.
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  mock-exporter:
    build: ./mock_exporter
    container_name: cm-mock-exporter
    environment:
      # Le simulateur émet aussi des traces : c'est ce qui rend la chaîne
      # vérifiable de bout en bout avant que M5 existe, exactement comme il le
      # fait déjà pour les métriques.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${MOCK_PORT:-8000}:8000"
    depends_on:
      - otel-collector
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  tempo-data:
