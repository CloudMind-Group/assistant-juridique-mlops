stages:
  ingest:
    cmd: python -m src.m1_ingestion.ingest --raw-dir data/raw --out-dir data/processed
    deps:
      - src/m1_ingestion/ingest.py
      - src/m1_ingestion/metadata_schema.py
      - src/m1_ingestion/anonymization_schema.py
      - src/m1_ingestion/segmentation.py
      - src/m1_ingestion/spelling.py
      - data/raw
    outs:
      - data/processed/documents
      - data/processed/metadata.jsonl
      - data/processed/ingestion_report.json
      - data/processed/segments.jsonl

  quality_check:
    cmd: python -m src.m1_ingestion.quality --processed-dir data/processed --fail-on-error
    deps:
      - src/m1_ingestion/quality.py
      - src/m1_ingestion/metadata_schema.py
      - data/processed/documents
      - data/processed/metadata.jsonl
    outs:
      - data/processed/quality_report.json
