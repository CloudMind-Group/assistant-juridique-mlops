name: Tag de release

# Pose le tag et publie la release dès qu'une branche release/* ou hotfix/*
# est fusionnée dans main. C'est l'étape que l'on oublie le plus souvent.
on:
  push:
    branches: [main]

# Moindre privilège : ce job n'écrit que des tags et des releases.
permissions:
  contents: write

jobs:
  tag:
    name: Poser le tag et publier la release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Récupérer l'historique complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire la version du message de fusion
        id: extraire
        run: |
          message=$(git log -1 --pretty=%B)
          echo "Message analysé :"
          echo "$message"

          # reconnaît « release: 0.2.0 », « release/0.2.0 », « hotfix/0.2.1 »
          version=$(printf '%s' "$message" \
            | grep -oiE '(release|hotfix)[:/ ]+v?[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$version" ]; then
            echo "Aucune version détectée : ce push ne vient pas d'une release. On s'arrête."
            echo "trouvee=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version détectée : $version"
            echo "trouvee=true"      >> "$GITHUB_OUTPUT"
            echo "version=$version"  >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier que le tag n'existe pas déjà
        if: steps.extraire.outputs.trouvee == 'true'
        id: verifier
        run: |
          if git rev-parse "v${{ steps.extraire.outputs.version }}" >/dev/null 2>&1; then
            echo "Le tag v${{ steps.extraire.outputs.version }} existe déjà — rien à faire."
            echo "poser=false" >> "$GITHUB_OUTPUT"
          else
            echo "poser=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Poser le tag annoté
        if: steps.verifier.outputs.poser == 'true'
        env:
          V: ${{ steps.extraire.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"
          echo "Tag v$V poussé."

      - name: Publier la release GitHub
        if: steps.verifier.outputs.poser == 'true'
        env:
          V: ${{ steps.extraire.outputs.version }}
        run: |
          gh release create "v$V" \
            --repo "$REPO" \
            --title "v$V" \
            --generate-notes \
            --latest
          echo "Release v$V publiée."

      - name: Rappeler le report vers develop
        if: steps.verifier.outputs.poser == 'true'
        env:
          V: ${{ steps.extraire.outputs.version }}
        run: |
          echo "::notice title=Report vers develop::La version v$V est livrée. Pensez à fusionner la branche de release dans develop, sinon les corrections seront perdues."
