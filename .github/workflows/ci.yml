name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']

# Principe de moindre privilège : le job ne fait que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Garde-fou M8 : vérifie qu'aucune donnée personnelle ne peut atteindre
  # data/processed/, et qu'aucune règle de masquage n'abîme les références
  # légales. Une régression ici est silencieuse en production — d'où le test.
  tests-python:
    name: Tests du pipeline d'ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest
          # Instrumentation M7 : le module importé par M5 est testé ici, pas
          # seulement écrit. Une régression sur la règle de cardinalité est
          # silencieuse en production — elle ne casse rien, elle sature.
          pip install fastapi httpx prometheus-client
          pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
                      opentelemetry-instrumentation-fastapi

      - name: Tests d'anonymisation
        run: python -m pytest tests/ -v

      - name: Génération du corpus synthétique M1
        run: python -m src.m1_ingestion.dataset_generator --count 60

      - name: Pipeline d'ingestion M1
        run: python -m src.m1_ingestion.ingest --raw-dir data/raw --out-dir data/processed

      - name: Contrôle qualité M1 (bloquant)
        run: python -m src.m1_ingestion.quality --processed-dir data/processed --fail-on-error

      - name: Tests d'instrumentation et de traçage (M7)
        run: python -m pytest monitoring/tests/ -v

  # Garde-fou M8 : le code Python et les dépendances n'étaient soumis à aucun
  # contrôle de sécurité — l'étape « aucun secret » du job `validate` est une
  # recherche textuelle qui ne détecterait pas, par exemple, une clé d'API
  # dépourvue de mot-clé. Ces deux analyses couvrent l'écart E-R6 du registre.
  #
  # En cas d'alerte : corriger, ou justifier explicitement (`# nosec` avec un
  # motif pour Bandit, montée de version ou épinglage pour pip-audit).
  # Ne pas désactiver l'étape.
  securite:
    name: Analyse de sécurité (code et dépendances)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des analyseurs
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Analyse statique du code (Bandit)
        # `monitoring` ajouté avec la pile d'observabilité de M7 : le code
        # Python qui y vit doit être soumis au même contrôle que le reste,
        # sans quoi il constituerait un angle mort de l'écart E-R6.
        run: bandit -r src dags monitoring --severity-level medium --confidence-level medium

      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  validate:
    name: Validation du site statique
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntaxe JavaScript
        run: |
          for f in assets/js/*.js; do
            echo "→ $f"
            node --check "$f"
          done

      - name: Cohérence du modèle de données
        run: node .github/scripts/check-data.mjs

      - name: Présence des fichiers requis
        run: |
          set -e
          for f in index.html README.md LICENSE \
                   assets/css/tokens.css assets/css/base.css \
                   assets/css/components.css assets/css/sections.css \
                   assets/js/data.js assets/js/render.js assets/js/app.js \
                   docs/ARCHITECTURE.md docs/TEAM.md docs/GITHUB.md; do
            test -f "$f" || { echo "::error::fichier manquant : $f"; exit 1; }
          done

      - name: Références locales résolues
        run: |
          set -e
          grep -oE '(href|src)="(assets|docs)/[^"]+"' index.html \
            | sed -E 's/.*="([^"]+)"/\1/' | sort -u | while read -r ref; do
              test -f "$ref" || { echo "::error::référence cassée dans index.html : $ref"; exit 1; }
              echo "ok → $ref"
            done

      - name: Aucun secret ni donnée sensible
        run: |
          if grep -rInE '(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}' \
               --include='*.js' --include='*.html' --include='*.css' \
               --include='*.py' --include='*.yaml' --include='*.yml' . ; then
            echo "::error::valeur sensible potentielle détectée"
            exit 1
          fi
          echo "aucune valeur sensible détectée"
